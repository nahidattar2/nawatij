<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ملف نواتج التعلم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#4a22a3;--p2:#5b2fc0;--pl:#efe9fb;--pl2:#f6f2fe;--line:#e7e2f2;--ink:#1d1838;--muted:#5d5a72;--teal:#1fb39c;--side:#3b1a8c;--ok:#1f9d86;--ok-soft:#e3f6f2;--wait:#8a7fb0;--wait-soft:#f2eefb}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"IBM Plex Sans Arabic",Tajawal,system-ui,sans-serif;background:#fff;color:var(--ink);line-height:1.6}
a{color:inherit}button{font-family:inherit}
.layout{display:flex;min-height:100vh}
/* الشريط الجانبي */
.side{flex:none;width:296px;background:linear-gradient(180deg,#3d1b90 0%,#33157c 100%);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:34px 0 26px}
.side-head{padding:0 30px 26px}
.side-head h2{margin:0;font-size:36px;font-weight:700;line-height:1.25}
.side-head p{margin:4px 0 0;color:#c9bdf2;font-size:19px}
#nav{display:flex;flex-direction:column;gap:6px;padding:0 0 0 0;overflow:auto}
.nav-i{white-space:nowrap;display:flex;align-items:center;gap:16px;margin:0 22px 0 12px;padding:13px 18px;border-radius:12px;text-decoration:none;color:#fff;font-size:19px;position:relative;cursor:pointer}
.nav-i svg{width:28px;height:28px;flex:none;stroke-width:1.6}
.nav-i:hover{background:rgba(255,255,255,.07)}
.nav-i.on{background:linear-gradient(90deg,#8a63ea,#7a52e2);font-weight:700}
.nav-i.on:after{content:"";position:absolute;right:-22px;top:4px;bottom:4px;width:6px;border-radius:4px;background:var(--teal)}
.side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.35);margin-inline:32px;padding-top:22px;text-align:center;font-size:19px}
/* المحتوى */
.main{flex:1;min-width:0;padding:22px 34px 18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.top .logo{height:104px;display:block}
.yr-pill{display:inline-flex;align-items:center;gap:10px;background:var(--pl);color:var(--ink);border-radius:999px;padding:9px 22px;font-size:17px;font-weight:500;white-space:nowrap}
.yr-pill svg{width:24px;height:24px;color:var(--p2)}
.intro h1{margin:6px 0 0;font-size:46px;font-weight:700;color:var(--ink);line-height:1.3}
.intro .school{font-size:23px;color:var(--muted);font-weight:500}
.intro .who{font-size:18px;color:var(--ink);margin-top:6px}
.intro .who i{font-style:normal;color:#b9b4cc;margin:0 18px}
#app{margin-top:20px}
.banner{background:var(--pl2);border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.banner.err{background:#fdecec;border-color:#f3c5c5;color:#8a2323}
/* بطاقات الأرقام */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.stat{display:flex;align-items:center;gap:18px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 26px;box-shadow:0 2px 10px rgba(40,20,90,.04)}
.stat .si{flex:none;width:72px;height:72px;display:grid;place-items:center}
.stat .si svg{width:70px;height:70px;stroke-width:1.3}
.stat .si.pur{color:var(--p2)}.stat .si.tea{color:var(--teal)}
.stat .sv{flex:1;text-align:center}
.stat b{display:block;font-size:36px;font-weight:700;line-height:1.15;color:var(--ink)}
.stat span{font-size:20px;color:var(--ink)}
.stat .sep{width:1px;align-self:stretch;background:var(--line);margin:4px 0}
.donut{flex:none;width:100px;height:100px;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:22px}
.cap{text-align:center;color:var(--muted);font-size:16px;margin:12px 0 0}
hr.ln{border:0;border-top:1px solid var(--line);margin:22px 0 4px}
h3.sec{font-size:28px;font-weight:700;margin:10px 0 18px;color:var(--ink)}
/* الأقسام الرئيسية */
.main-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
.mcard{border:1.5px solid #d8ccf4;border-radius:14px;padding:20px 26px 18px;background:#fff;display:flex;flex-direction:column}
.mc-top{display:flex;gap:18px;align-items:flex-start}
.mc-ico{flex:none;width:72px;height:72px;border-radius:12px;background:var(--pl);color:var(--p2);display:grid;place-items:center}
.mc-ico svg{width:46px;height:46px;stroke-width:1.7}
.mcard h2{margin:0;font-size:28px;font-weight:700;color:var(--p)}
.mcard p{margin:4px 0 0;font-size:18px;color:var(--ink)}
.mc-pills{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 0;padding-right:90px}
.mpill{background:var(--pl);color:var(--p);border-radius:10px;padding:3px 20px;font-size:17px}
.mpill b{font-weight:700}
.btn{align-self:flex-end;margin-top:auto;display:inline-flex;align-items:center;gap:18px;background:linear-gradient(90deg,#5a2ec0,#4a22a3);color:#fff;border:0;border-radius:8px;padding:10px 26px;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(74,34,163,.25);text-decoration:none}
.btn .ar{font-size:22px;line-height:1}
.mcard .btn{margin-top:18px}
/* الشواهد والتحسين */
.ev-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ev{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 22px 16px;box-shadow:0 4px 14px rgba(40,20,90,.08);cursor:pointer;display:grid;grid-template-columns:1fr auto;align-items:end;text-align:center}
.ev .ei{grid-column:1/-1;justify-self:center;height:52px;display:grid;place-items:center}
.ev .ei svg{width:44px;height:44px;stroke-width:1.7}
.ev .ei.tea{color:var(--teal)}.ev .ei.pur{color:var(--p2)}
.ev b{font-size:22px;font-weight:700;color:var(--ink)}
.ev .ar{color:var(--p);font-size:24px;line-height:1}
.ev:hover,.mcard:hover{box-shadow:0 8px 22px rgba(74,34,163,.14)}
/* التذييل */
footer{margin-top:30px;border-top:1.5px solid #d8ccf4;padding-top:16px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.f-links{display:flex;flex-wrap:wrap;align-items:center;font-size:19px}
.f-links a{color:var(--p2);text-decoration:none;cursor:pointer}
.f-links i{color:var(--p2);margin:0 26px;font-style:normal}
.f-name{text-align:left;line-height:1.25}
.f-name b{display:block;font-size:20px}
.f-name span{color:var(--muted);font-size:16px}
.sync{width:100%;color:#9a96ad;font-size:13px}
.sync button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:2px 10px;color:var(--p2);cursor:pointer;font-size:13px;margin-inline-start:6px}
/* الصفحات الداخلية */
.panel{background:#fff;border:1.5px solid #d8ccf4;border-radius:14px;padding:22px 26px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.back{background:var(--pl);color:var(--p);border:0;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:16px;font-weight:700}
.drive{margin-inline-start:auto;font-size:15px;text-decoration:none;color:var(--p);border:1px solid #d8ccf4;border-radius:8px;padding:6px 14px;background:#fff}
.panel h2{margin:8px 0 2px;font-size:30px;color:var(--p)}
.panel .desc{color:var(--muted);margin:0 0 14px;font-size:17px}
.tabs{display:flex;gap:6px;margin:10px 0 16px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:8px 16px;cursor:pointer;font-size:17px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--p);border-color:var(--p);font-weight:700}
.t-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.t-card{border:1px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;background:#fff;box-shadow:0 4px 14px rgba(40,20,90,.06)}
.t-card:hover{border-color:#cbbcf2}
.t-card b{font-size:19px;color:var(--p)}
.t-card .row{display:flex;justify-content:space-between;color:var(--muted);font-size:14.5px;margin-top:4px}
.bar{height:8px;background:#ebe7f3;border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#5b2fc0,var(--teal));border-radius:99px}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.dot{font-size:12.5px;border-radius:6px;padding:1px 8px}
.dot.y{background:var(--ok-soft);color:var(--ok)}.dot.n{background:#f3f1f8;color:#a7a3b8}
.pill{font-size:13.5px;border-radius:999px;padding:2px 12px;background:var(--pl);color:var(--p)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.wait{background:var(--wait-soft);color:var(--wait)}
.matrix{overflow:auto;border:1px solid var(--line);border-radius:12px}
.matrix table{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
.matrix th,.matrix td{padding:10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.matrix th{background:var(--pl2);color:var(--p)}
.matrix td:first-child,.matrix th:first-child{text-align:right;position:sticky;right:0;background:#fff}
.matrix th:first-child{background:var(--pl2)}
.yes{color:var(--ok);font-weight:700}.no{color:#c9c4d8}
.legend{font-size:14px;color:var(--muted);margin-top:8px}
details.fold{border:1px solid var(--line);border-radius:12px;margin:12px 0;overflow:hidden}
details.fold>summary{list-style:none;cursor:pointer;padding:13px 18px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;color:var(--p);background:var(--pl2)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:before{content:"‹";font-size:22px;transition:transform .15s}
details.fold[open]>summary:before{transform:rotate(-90deg)}
details.fold>summary .pill{margin-inline-start:auto;font-weight:500}
.fold-body{padding:14px}
.leaf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.leaf{border:1px solid #d8ccf4;border-radius:12px;background:#fff;overflow:hidden;padding-bottom:8px}
.leaf.empty{border-style:dashed}
.leaf>:not(.leaf-h){margin-inline:12px}
.leaf-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;color:#fff;background:linear-gradient(90deg,#5a2ec0,#4a22a3);padding:10px 14px;margin-bottom:8px}
.leaf.empty .leaf-h{background:var(--pl);color:var(--p)}
.leaf-h a{margin-inline-start:auto;font-size:13px;color:inherit;opacity:.85;text-decoration:none;font-weight:500}
.file{display:flex;align-items:flex-start;gap:8px;padding:7px 6px;border-radius:8px;text-decoration:none;font-size:16px}
.file:hover{background:var(--pl2)}
.file .nm{flex:1;line-height:1.5}
.file .dt{font-size:13px;color:var(--muted);white-space:nowrap}
.leaf .file .dt{display:none}
.chip{flex:none;font-size:12px;font-weight:700;border-radius:6px;padding:1px 6px;min-width:44px;text-align:center;margin-top:2px}
.c-pdf{background:#fde7e5;color:#b3261e}.c-doc{background:#e3edfd;color:#1f5bc6}.c-sheet{background:#e2f3e8;color:#1e7a43}.c-slide{background:#fff0d6;color:#a35d00}.c-img{background:#f1e6fb;color:#7a3db8}.c-vid{background:#e6e6e6;color:#333}.c-oth{background:#eef0f1;color:#55636a}
.new{font-size:11.5px;background:var(--teal);color:#fff;border-radius:6px;padding:0 6px}
.wait-txt{color:var(--wait);font-size:15px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.links a{text-decoration:none;background:var(--pl);color:var(--p);border-radius:8px;padding:8px 16px;font-size:15px;font-weight:700}
.note{background:var(--pl2);border-radius:10px;padding:10px 14px;color:var(--p);font-size:15px;margin-top:12px}
.path{font-size:12.5px;color:var(--muted)}
.search{width:100%;padding:13px 18px;border-radius:10px;border:1px solid #d8ccf4;font-family:inherit;font-size:16px;margin:4px 0 14px}
.search:focus{outline:2px solid var(--p2);border-color:transparent}
.ev-list .file{border-bottom:1px solid #f1eef7;border-radius:0}
.pv{position:fixed;inset:0;background:rgba(25,12,60,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.pv.on{display:flex}
.pv-box{background:#fff;border-radius:16px;width:min(980px,100%);height:min(92vh,900px);display:flex;flex-direction:column;overflow:hidden}
.pv-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.pv-head b{flex:1;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-head small{color:var(--muted)}
.pv-close{background:var(--pl);border:0;border-radius:10px;width:36px;height:36px;font-size:20px;cursor:pointer}
.pv iframe{flex:1;border:0;width:100%;background:#f3f3f3}
.pv-demo{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px}
.embed{width:100%;height:560px;border:1px solid var(--line);border-radius:12px}
/* الجوال والأجهزة الصغيرة */
@media (max-width:1100px){.ev-grid{grid-template-columns:repeat(2,1fr)}.stat{padding:14px 16px}.stat .si,.stat .si svg{width:54px;height:54px}.donut{width:80px;height:80px}}
@media (max-width:860px){
 .layout{flex-direction:column}
 .side{position:sticky;top:0;z-index:20;width:auto;height:auto;padding:12px 0 10px}
 .side-head{padding:0 18px 8px;display:flex;align-items:baseline;gap:10px}
 .side-head h2{font-size:24px}.side-head p{font-size:15px;margin:0}
 #nav{flex-direction:row;overflow-x:auto;gap:6px;padding:0 12px;scrollbar-width:none}
 #nav::-webkit-scrollbar{display:none}
 .nav-i{margin:0;padding:7px 13px;font-size:15px;white-space:nowrap;gap:8px;flex:none}
 .nav-i svg{width:20px;height:20px}
 .nav-i.on:after{display:none}
 .side-foot{display:none}
 .main{padding:16px 14px}
 html,body{overflow-x:hidden}.layout,.main,.side{max-width:100vw}
 .top{flex-wrap:wrap;justify-content:center}.top .logo{height:auto;width:min(260px,70vw)}.yr-pill{font-size:14px;padding:6px 14px}
 .intro{text-align:center}
 .intro h1{font-size:34px}.intro .school{font-size:18px}.intro .who{font-size:15px}
 .intro .who i{margin:0 8px}
 .stats{grid-template-columns:1fr;gap:10px}
 .stat b{font-size:30px}.stat span{font-size:17px}
 .main-grid{grid-template-columns:1fr}
 .mcard{padding:16px 16px}.mcard h2{font-size:23px}.mcard p{font-size:16px}
 .mc-ico{width:58px;height:58px}.mc-ico svg{width:36px;height:36px}
 .mc-pills{padding-right:0}
 .btn{align-self:stretch;justify-content:center}
 h3.sec{font-size:23px}
 .ev-grid{gap:10px}.ev{padding:10px 14px 12px}.ev b{font-size:17px}
 .f-links{font-size:15px}.f-links i{margin:0 8px}
 .panel{padding:16px}
}
</style>
</head>

const ico=k=>`<svg viewBox="0 0 24 24" aria-hidden="true" stroke-width="1.7">${ICONS[k]||ICONS.chart}</svg>`;
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=n=>{const c=String(n).replace(/^[\s\d٠-٩]+[-–.)\s]+/,'').trim();return c||n};
const norm=s=>clean(String(s).replace(/[\u200B-\u200F\u202A-\u202E\u2066-\u2069\u0640\uFEFF\u00A0]/g,' ')).replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ');
const fid=l=>{if(!l)return'';const m=l.match(/folders\/([\w-]+)/)||l.match(/[?&]id=([\w-]+)/);return m?m[1]:(/^[\w-]{15,}$/.test(l)?l:'')};
const SECS=CONFIG.sections.map(s=>({...s,fid:fid(s.folder)}));
let MODE='demo',ROOT=null,UPDATED=null,ERR='';
const BYID={},PARENT={};

/* ---------- البيانات ---------- */
function index(node,parent){BYID[node.id]=node;if(parent)PARENT[node.id]=parent;node.folders.forEach(f=>index(f,node));}
function countFiles(n){return n.files.length+n.folders.reduce((a,f)=>a+countFiles(f),0)}
function lastDate(n){let d=n.files.reduce((m,f)=>f.date>m?f.date:m,'');n.folders.forEach(f=>{const x=lastDate(f);if(x>d)d=x});return d}
function allFiles(n,path=[]){let r=n.files.map(f=>({...f,path}));n.folders.forEach(f=>r=r.concat(allFiles(f,path.concat(clean(f.name)))));return r}
function leaves(n){return n.folders.length?n.folders.flatMap(leaves):[{name:clean(n.name),n:n.files.length}]}
function findOne(q){const queue=[...ROOT.folders];q=norm(q).replace(/\s+/g,'');
  while(queue.length){const f=queue.shift();if(norm(f.name).replace(/\s+/g,'').includes(q))return f;queue.push(...f.folders)}return null}
function findSec(s){
  if(!ROOT)return null;
  if(s.fid&&BYID[s.fid])return BYID[s.fid];
  const qs=[].concat(s.match||s.title);let f=null;
  for(const q of qs){f=findOne(q);if(f)break}
  if(f&&s.view==='teachers'){ // إن كان بداخله مجلد فصل واحد فقط ننزل إليه مباشرة
    while(f.folders.length===1&&/فصل/.test(norm(f.folders[0].name))&&!f.files.length)f=f.folders[0];
  }
  return f;
}
function teacherStats(sec){
  const teachers=sec.folders;const cols=[];
  teachers.forEach(t=>t.folders.flatMap(leaves).forEach(l=>{if(!cols.includes(l.name))cols.push(l.name)}));
  const rows=teachers.map(t=>{const L={};t.folders.flatMap(leaves).forEach(l=>L[l.name]=(L[l.name]||0)+l.n);
    const done=cols.filter(c=>L[c]>0).length;return{t,L,done,pct:cols.length?Math.round(done/cols.length*100):(countFiles(t)?100:0)}});
  const pct=rows.length?Math.round(rows.reduce((a,r)=>a+r.pct,0)/rows.length):0;
  return{cols,rows,pct};
}

/* ---------- عناصر مساعدة ---------- */
function chip(t,name){t=t||'';const e=(name.split('.').pop()||'').toLowerCase();
  if(t.includes('pdf')||e==='pdf')return'<span class="chip c-pdf">PDF</span>';
  if(t.includes('spreadsheet')||t.includes('excel')||/xlsx?|csv/.test(e))return'<span class="chip c-sheet">جدول</span>';
  if(t.includes('presentation')||t.includes('powerpoint')||/pptx?/.test(e))return'<span class="chip c-slide">عرض</span>';
  if(t.includes('document')||t.includes('word')||/docx?/.test(e))return'<span class="chip c-doc">مستند</span>';
  if(t.startsWith('image')||/png|jpe?g|heic|webp/.test(e))return'<span class="chip c-img">صورة</span>';
  if(t.startsWith('video')||/mp4|mov/.test(e))return'<span class="chip c-vid">فيديو</span>';
  if(t.includes('folder'))return'<span class="chip c-oth">مجلد</span>';
  return'<span class="chip c-oth">ملف</span>';}
let HF;try{HF=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long'})}catch(e){HF=null}
const fmt=d=>{if(!d)return'';try{return HF?HF.format(new Date(d)):new Date(d).toLocaleDateString('ar')}catch(e){return''}};
const isNew=d=>d&&(Date.now()-new Date(d))<7*864e5;
const fileRow=(f,showPath)=>`<a class="file" title="${esc(fmt(f.date))}" href="${esc(f.url)}" target="_blank" rel="noopener" data-name="${esc(f.name)}" data-date="${esc(fmt(f.date))}" onclick="pv(event,this)">${chip(f.type,f.name)}<span class="nm">${esc(f.name.replace(/\.[a-z0-9]{2,5}$/i,''))}${showPath&&f.path.length?`<div class="path">${esc(f.path.join(' ‹ '))}</div>`:''}</span>${isNew(f.date)?'<span class="new">جديد</span>':''}<span class="dt">${fmt(f.date)}</span></a>`;
const driveLink=(url,txt='فتح في Google Drive ↗')=>url&&url!=='#'?`<a class="drive" href="${esc(url)}" target="_blank" rel="noopener">${txt}</a>`:'';
const emptyLabel=(sec,name)=>{const m=sec&&sec.emptyLabels;if(m)for(const k in m)if(norm(name)===norm(k))return m[k];return'قيد الاستكمال'};

function pctNode(n,sec){const L=leaves(n).filter(l=>emptyLabel(sec,l.name)==='قيد الاستكمال');
  if(!L.length)return countFiles(n)?100:0;return Math.round(L.filter(l=>l.n>0).length/L.length*100)}
const prog=p=>`<div class="prog"><div class="bar"><i style="width:${p}%"></i></div><span>${p}%</span></div>`;
function renderBody(node,depth,sec){
  let h='';
  if(node.files.length)h+=`<div>${node.files.map(f=>fileRow(f)).join('')}</div>`;
  const subs=node.folders;
  if(!subs.length){if(!node.files.length)h+=`<div class="wait-txt">⏳ ${emptyLabel(sec,node.name)}</div>`;return h}
  if(subs.every(f=>!f.folders.length)){
    h+='<div class="leaf-grid">'+subs.map(f=>`<div class="leaf ${f.files.length?'':'empty'}"><div class="leaf-h">${f.files.length?'✅':'⏳'} ${esc(clean(f.name))}${f.url!=='#'?`<a href="${esc(f.url)}" target="_blank" rel="noopener">درايف ↗</a>`:''}</div>${f.files.length?f.files.map(x=>fileRow(x)).join(''):`<div class="wait-txt">${emptyLabel(sec,f.name)}</div>`}</div>`).join('')+'</div>';
    return h;
  }
  h+=subs.map(f=>{const c=countFiles(f);return`<details class="fold" ${depth<1?'open':''}><summary>${esc(clean(f.name))}<span class="pill ${c?'ok':'wait'}">${c?c+' ملف':emptyLabel(sec,f.name)}</span></summary><div class="fold-body">${renderBody(f,depth+1,sec)}</div></details>`}).join('');
  return h;
}

  h+='<h3 class="sec">الأقسام الرئيسية</h3><div class="main-grid">'+vis.filter(x=>x.s.main).map(({s,node})=>{

}
const EV=[{k:'evall',t:'الشواهد والأدلة',i:'doc',c:'tea',re:null,d:'جميع الشواهد والملفات المرفوعة في الملف، الأحدث أولاً.'},
 {k:'evan',t:'تحليل النتائج',i:'bars',c:'pur',re:/تحليل|اختبار|تشخيص|فتره|نهائي/,d:'ملفات تحليل الاختبارات لجميع المواد.'},
 {k:'evplan',t:'الخطط العلاجية',i:'gear',c:'tea',re:/علاج|اثرائ/,d:'الخطط العلاجية والإثرائية وشواهد تطبيقها لجميع المواد.'},
 {k:'evimp',t:'أثر التحسين',i:'up',c:'pur',re:/اثر|تحسن|تحسين|مقارن|بعدي/,d:'شواهد أثر الخطط على مستوى الطالبات (مقارنات قبلي/بعدي).'}];
function evView(e){
  const all=ROOT?allFiles(ROOT):[];
  const list=(e.re?all.filter(f=>e.re.test(norm(f.path.join(' ')+' '+f.name))):all).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  let h=`<div class="panel"><div class="topbar"><button class="back" onclick="go('')">→ الرئيسية</button></div><h2>${e.t}</h2><p class="desc">${e.d} · ${list.length} ملف</p>`;
  h+=`<input class="search" placeholder="ابحثي باسم الملف أو المادة…" oninput="evFilter(this.value)"><div class="ev-list" id="evl">${list.length?list.map(f=>fileRow(f,true)).join(''):'<div class="wait-txt">⏳ قيد الاستكمال</div>'}</div></div>`;
  app.innerHTML=h;
}
function evFilter(q){q=norm(q||'');document.querySelectorAll('#evl .file').forEach(a=>{a.style.display=!q||norm(a.textContent).includes(q)?'':'none'})}
function search(q){const box=document.getElementById('res');q=norm(q||'');if(q.length<2){box.style.display='none';return}
  const r=allFiles(ROOT).filter(f=>norm(f.name).includes(q)||norm(f.path.join(' ')).includes(q)).slice(0,60);
  box.style.display='block';box.innerHTML=r.length?r.map(f=>fileRow(f,true)).join(''):'<div class="wait-txt">لا توجد نتائج</div>';}

function sectionView(s,tIdx){
  const node=findSec(s);
  let h=`<div class="panel"><div class="topbar"><button class="back" onclick="go('${tIdx!=null?s.key:''}')">→ ${tIdx!=null?esc(s.title):'الرئيسية'}</button>`;
  if(MODE==='embed'){
    h+=`${driveLink('https://drive.google.com/drive/folders/'+s.fid)}</div><h2>${esc(s.title)}</h2><p class="desc">${esc(s.desc)}</p>
      <iframe class="embed" src="https://drive.google.com/embeddedfolderview?id=${s.fid}#list" loading="lazy"></iframe>${extrasOf(s)}</div>`;
    app.innerHTML=h;return;
  }
  if(!node){app.innerHTML=h+'</div><p>لم يُعثر على المجلد.</p></div>';return}
  if(tIdx!=null){
    const t=node.folders[tIdx];if(!t){go(s.key);return}
    const st=teacherStats(node).rows[tIdx];
    h+=`${driveLink(t.url)}</div><h2>${esc(clean(t.name))}</h2>
      <p class="desc">اكتمال الشواهد: ${st.pct}% · ${countFiles(t)} ملف</p><div class="bar" style="margin-bottom:14px"><i style="width:${st.pct}%"></i></div>${renderBody(t,0,s)}</div>`;
    app.innerHTML=h;return;
  }
  h+=`${driveLink(node.url)}</div><h2>${esc(s.title)}</h2><p class="desc">${esc(s.desc)}</p>`;
  if(s.view==='teachers'&&node.folders.length){
    const st=teacherStats(node);
    h+=`<div class="tabs"><button class="tab on" data-t="cards" onclick="tab(this)">المواد (${st.rows.length})</button>${st.cols.length?'<button class="tab" data-t="matrix" onclick="tab(this)">لوحة الاكتمال</button>':''}</div>`;
    h+=`<div id="tab-cards" class="t-grid">${st.rows.map((r,i)=>`<div role="button" tabindex="0" class="t-card" onclick="go('${s.key}-t${i}')"><b>${esc(clean(r.t.name))}</b><div class="row"><span>${countFiles(r.t)} ملف</span><span>${r.pct}%</span></div><div class="bar"><i style="width:${r.pct}%"></i></div><div class="dots">${st.cols.map(c=>`<span class="dot ${r.L[c]?'y':'n'}">${esc(c)}</span>`).join('')}</div></div>`).join('')}</div>`;
    if(st.cols.length)h+=`<div id="tab-matrix" style="display:none"><div class="matrix"><table><tr><th>المادة</th>${st.cols.map(c=>`<th>${esc(c)}</th>`).join('')}<th>الاكتمال</th></tr>${st.rows.map((r,i)=>`<tr><td><a href="#${s.key}-t${i}">${esc(clean(r.t.name))}</a></td>${st.cols.map(c=>`<td>${r.L[c]?`<span class="yes">✓ ${r.L[c]}</span>`:'<span class="no">—</span>'}</td>`).join('')}<td><b>${r.pct}%</b></td></tr>`).join('')}</table></div><div class="legend">✓ = تم رفع الشاهد (والرقم عدد الملفات) · — = لم يُرفع بعد. تتحدث تلقائياً كلما أضافت معلمة ملفاً.</div></div>`;
  } else h+=renderBody(node,0,s);
  h+=extrasOf(s)+'</div>';
  app.innerHTML=h;
}
function extrasOf(s){let h='';if(s.note)h+=`<div class="note">${esc(s.note)}</div>`;
  if(s.links&&s.links.length)h+='<div class="links">'+s.links.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title)} ↗</a>`).join('')+'</div>';return h}
function tab(b){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('tab-cards').style.display=b.dataset.t==='cards'?'':'none';
  const m=document.getElementById('tab-matrix');if(m)m.style.display=b.dataset.t==='matrix'?'':'none';}


function copyUrl(u){if(!u)return'';const m=u.match(/docs\.google\.com\/(document|spreadsheets|presentation)\/d\/([\w-]+)/);
  return m?`https://docs.google.com/${m[1]}/d/${m[2]}/copy`:u;}
/* ---------- معاينة الملف داخل اللوحة ---------- */
function previewUrl(u){const m=u.match(/\/d\/([\w-]+)/)||u.match(/[?&]id=([\w-]+)/);if(!m)return'';
  if(/docs\.google\.com\/(document|spreadsheets|presentation)/.test(u))return u.replace(/\/(edit|view|htmlview)[^]*$/,'')+'/preview';
  return'https://drive.google.com/file/d/'+m[1]+'/preview';}
function pv(e,a){const u=a.getAttribute('href');const p=u&&u!=='#'?previewUrl(u):'';
  if(u&&u!=='#'&&!p)return; e.preventDefault();
  document.getElementById('pv-name').textContent=a.dataset.name;document.getElementById('pv-date').textContent=a.dataset.date||'';
  document.getElementById('pv-chip').innerHTML=a.querySelector('.chip').outerHTML;
  const o=document.getElementById('pv-open');o.href=u;o.style.display=p?'':'none';
  document.getElementById('pv-body').innerHTML=p?`<iframe src="${p}" allow="autoplay" allowfullscreen></iframe>`:'<div class="pv-demo"><div><div style="font-size:42px">📄</div>هنا يظهر الملف نفسه كما يعرضه Google Drive<br>(PDF، صور، مستندات، جداول، عروض، فيديو)<br><small>هذا عرض تجريبي — مع الملفات الحقيقية يظهر محتواها كاملاً</small></div></div>';
  document.getElementById('pv').classList.add('on');document.body.style.overflow='hidden';}
function pvClose(){document.getElementById('pv').classList.remove('on');document.getElementById('pv-body').innerHTML='';document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')pvClose();if(e.key==='Enter'&&e.target.getAttribute&&e.target.getAttribute('role')==='button')e.target.click()});

/* ---------- التنقل ---------- */
function go(h){if(location.hash.slice(1)===h)route();else location.hash=h;window.scrollTo({top:0,behavior:'smooth'})}
function route(){const h=decodeURIComponent(location.hash.slice(1));
  const e=EV.find(x=>x.k===h);if(e){setNav('');evView(e);return}
  const m=h.match(/^([a-z0-9]+)(?:-t(\d+))?$/);const s=m&&SECS.find(x=>x.key===m[1]);
  setNav(s?s.key:'');
  if(s)sectionView(s,m[2]!=null?+m[2]:null);else home();}
window.addEventListener('hashchange',route);

/* ---------- التحميل ---------- */
async function load(fresh){
  if(CONFIG.scriptUrl){
    app.innerHTML='<div class="panel" style="text-align:center;color:#66767c">جارٍ تحميل أحدث الملفات من الدرايف…</div>';
    try{const r=await fetch(CONFIG.scriptUrl+(fresh?'?fresh=1':''));const j=await r.json();ROOT=j.tree;UPDATED=j.updated;MODE='live';ERR=''}
    catch(e){ERR='تعذّر الاتصال بالدرايف الآن — تُعرض روابط المجلدات مباشرة.';MODE=SECS.some(s=>s.fid)?'embed':'demo';if(MODE==='demo')ROOT=demo()}
  } else if(SECS.some(s=>s.fid))MODE='embed';
  else{MODE='demo';ROOT=demo()}
  for(const k in BYID)delete BYID[k];if(ROOT)index(ROOT);
  foot();route();
}
function foot(){const L=[['intro','التعريف بالملف'],['committee','لجنة التحصيل'],['baseline','نتائج العام السابق'],['plans','الخطط والبرامج']];
  document.getElementById('foot').innerHTML=`<div class="f-links">${L.map(([k,t])=>`<a onclick="go('${k}')">${t}</a>`).join('<i>|</i>')}</div><div class="f-name"><b>ناهد عطار</b><span>Nahid Attar</span></div>${UPDATED?`<div class="sync">آخر مزامنة: ${new Date(UPDATED).toLocaleTimeString('ar-SA',{hour:'numeric',minute:'2-digit'})}<button onclick="load(true)">تحديث الآن</button></div>`:''}`}

/* ---------- بيانات العرض التجريبي ---------- */
function demo(){
  let id=0;const D=n=>new Date(Date.now()-n*864e5).toISOString();
  const F=(name,a=[],b=[])=>({id:'d'+(++id),name,url:'#',folders:a.filter(x=>x.folders),files:a.filter(x=>!x.folders).concat(b)});
  const f=(name,days,type)=>({name,url:'#',type:type||'application/pdf',date:D(days)});
  const teacher=(name,s)=>F(name,[
    F('١- تحليلات الاختبارات',[
      F('١- تشخيصي',s[0]?[f('تحليل الاختبار التشخيصي — رياضيات ٢',s[0]),f('خطة معالجة الفاقد التعليمي',s[0]+1,'application/vnd.google-apps.document')]:[]),
      F('٢- فترة أولى',s[1]?[f('تحليل نتائج اختبار الفترة الأولى',s[1],'application/vnd.google-apps.spreadsheet')]:[]),
      F('٣- فترة ثانية',s[2]?[f('تحليل نتائج اختبار الفترة الثانية',s[2])]:[]),
      F('٤- نهائي',[])]),
    F('٢- الخطط العلاجية والإثرائية',s[3]?[f('الخطة العلاجية للطالبات المتأخرات',s[3],'application/vnd.google-apps.document'),f('الخطة الإثرائية للمتفوقات',s[3]+2,'application/vnd.google-apps.document'),f('شاهد تنفيذ — حصة علاجية',s[3]+1,'image/jpeg')]:[])
  ]);
  return F('ملف نواتج التعلم',[
    F('ملف التحصيل الدراسي',[teacher('ناهد علي عطار',[20,3,0,5]),teacher('معلمة نموذجية ٢',[25,9,0,0]),teacher('معلمة نموذجية ٣',[22,0,0,12]),teacher('معلمة نموذجية ٤',[0,0,0,0])]),
    F('ملف القدرات والتحصيلي',[
      F('القدرات',[F('١- الخطة الإجرائية للقدرات',[f('الخطة الإجرائية للاستعداد لاختبار القدرات',30,'application/vnd.google-apps.document')]),
        F('٢- حصر الطالبات المسجلات',[f('كشف المسجلات في قياس',14,'application/vnd.google-apps.spreadsheet')]),
        F('٣- الحصص والدورات التدريبية',[f('جدول حصص القدرات',18),f('صور من حصة التدريب',2,'image/jpeg')]),
        F('٤- الاختبارات التدريبية وتحليلها',[f('تقرير تحليل اختبار القدرات الكمي ١',1)]),
        F('٥- نتائج قياس الرسمية',[])]),
      F('التحصيلي',[])]),
    F('التعريف بالملف ولجنة التحصيل',[F('قرار تشكيل اللجنة ومهامها',[f('قرار التشكيل',40)]),F('الخطة الإجرائية والجدول الزمني',[f('الخطة الإجرائية',38)]),F('محاضر الاجتماعات',[f('محضر الاجتماع الأول',10)])]),
    F('نتائج العام السابق',[],[f('تحليل نتائج ١٤٤٧هـ ونقاط القوة والضعف',45)]),
    F('فئات المتابعة',[F('المتفوقات والموهوبات',[f('بيان المتفوقات والحوافز',8,'application/vnd.google-apps.spreadsheet')]),F('المتأخرات دراسياً',[])]),
    F('التواصل مع أولياء الأمور',[]),
    F('البرامج ومجتمعات التعلم',[],[f('مجتمع تعلم: تحليل نتائج الاختبارات',6,'application/vnd.google-apps.presentation')]),
    F('شهادات الشكر',[])
  ]);
}

document.getElementById('title').textContent=CONFIG.title;
document.getElementById('school').textContent=CONFIG.school;
load();
</script>
