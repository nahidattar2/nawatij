<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ملف نواتج التعلم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14303a;--teal:#0f5560;--teal2:#16727e;--teal-soft:#e3f0f1;--gold:#c2933a;--gold-soft:#f8eedb;--bg:#f5f3ee;--card:#fff;--line:#e5e1d7;--muted:#66767c;--ok:#2e7d5b;--ok-soft:#e2f2ea;--wait:#a86a14;--wait-soft:#fbf0dc}
*{box-sizing:border-box}
body{margin:0;font-family:Tajawal,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
a{color:inherit}
button{font-family:inherit}
.hero{background:radial-gradient(1200px 400px at 80% -20%,#1d8b97 0,transparent 60%),linear-gradient(135deg,#0b3f48,#14707c);color:#fff;padding:34px 20px 78px;text-align:center}
.hero .ministry{font-size:13px;opacity:.75;letter-spacing:.2px}
.hero .school{font-size:16px;opacity:.92;margin-top:2px}
.hero h1{font-size:44px;margin:10px 0 4px;font-weight:800;letter-spacing:-.5px}
.hero .year{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#f6dfae;border-radius:999px;padding:3px 16px;font-size:14px}
.wrap{max-width:1060px;margin:-48px auto 30px;padding:0 16px;position:relative}
.banner{background:var(--gold-soft);border:1px solid #ecd9b2;color:#6d4f12;border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.banner.err{background:#fdecec;border-color:#f3c5c5;color:#8a2323}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--card);border-radius:14px;padding:14px 10px;text-align:center;box-shadow:0 2px 12px rgba(20,48,58,.07)}
.stat b{display:block;font-size:26px;color:var(--teal);line-height:1.2}
.stat span{font-size:13px;color:var(--muted)}
.main-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.main-btn{display:flex;gap:16px;align-items:flex-start;text-align:right;background:var(--card);border:0;border-radius:18px;padding:22px;cursor:pointer;box-shadow:0 3px 16px rgba(20,48,58,.08);border-top:5px solid var(--teal);transition:transform .15s,box-shadow .15s;width:100%;color:var(--ink)}
.main-btn.gold{border-top-color:var(--gold)}
.main-btn:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(20,48,58,.13)}
.ico{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal)}
.gold .ico{background:var(--gold-soft);color:var(--gold)}
.ico svg{width:30px;height:30px}
.main-btn>span:last-child{flex:1;display:block}
.main-btn h2{margin:0 0 4px;font-size:23px}
.main-btn p{margin:0;color:var(--muted);font-size:14.5px}
.meta{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12.5px;border-radius:999px;padding:2px 10px;background:#f0eee8;color:#4b5a60}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.wait{background:var(--wait-soft);color:var(--wait)}
.bar{height:8px;background:#ece8df;border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal2),#3aa3a0);border-radius:99px}
h3.sec{font-size:17px;margin:28px 2px 10px;color:var(--teal);display:flex;align-items:center;gap:8px}
h3.sec:after{content:"";flex:1;height:1px;background:var(--line)}
.extras{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.x-btn{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:right;cursor:pointer;color:var(--ink);transition:border-color .15s,transform .15s}
.x-btn:hover{border-color:var(--teal2);transform:translateY(-2px)}
.x-btn b{display:block;font-size:16px}
.x-btn small{color:var(--muted);font-size:13px;display:block;margin-top:2px}
.search{width:100%;margin-top:22px;padding:13px 16px;border-radius:12px;border:1px solid var(--line);font-family:inherit;font-size:15px;background:#fff}
.search:focus{outline:2px solid var(--teal2);border-color:transparent}
.panel{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 3px 16px rgba(20,48,58,.08)}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.back{background:var(--teal-soft);color:var(--teal);border:0;border-radius:10px;padding:7px 14px;cursor:pointer;font-size:14px;font-weight:700}
.crumb{color:var(--muted);font-size:14px}
.drive{margin-inline-start:auto;font-size:13.5px;text-decoration:none;color:var(--teal);border:1px solid var(--teal-soft);border-radius:10px;padding:6px 12px;background:#fff}
.drive:hover{background:var(--teal-soft)}
.panel h2{margin:6px 0 2px;font-size:26px}
.panel .desc{color:var(--muted);margin:0 0 14px}
.tabs{display:flex;gap:6px;margin:10px 0 16px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:8px 14px;cursor:pointer;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--teal);border-color:var(--teal);font-weight:700}
.t-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.t-card{border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:#fff;text-align:right;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.t-card:hover{border-color:var(--teal2);box-shadow:0 6px 18px rgba(20,48,58,.08)}
.t-card b{font-size:16.5px}
.t-card .row{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:4px}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.dot{font-size:11.5px;border-radius:6px;padding:1px 7px}
.dot.y{background:var(--ok-soft);color:var(--ok)}
.dot.n{background:#f1efe9;color:#9aa4a7}
.matrix{overflow:auto;border:1px solid var(--line);border-radius:12px}
.matrix table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
.matrix th,.matrix td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.matrix th{background:#f7f5f0;font-weight:700;color:var(--teal)}
.matrix td:first-child,.matrix th:first-child{text-align:right;position:sticky;right:0;background:#fff}
.matrix th:first-child{background:#f7f5f0}
.yes{color:var(--ok);font-weight:800}
.no{color:#c9c3b6}
.legend{font-size:13px;color:var(--muted);margin-top:8px}
details.fold{border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fff;overflow:hidden}
details.fold>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;background:#faf9f6}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:before{content:"‹";font-size:20px;color:var(--teal);transition:transform .15s;display:inline-block}
details.fold[open]>summary:before{transform:rotate(-90deg)}
details.fold>summary .pill{margin-inline-start:auto;font-weight:500}
.fold-body{padding:12px 14px}
.leaf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.leaf{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;min-height:84px}
.leaf.empty{background:#fbfaf7;border-style:dashed}
.leaf-h{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;margin-bottom:6px}
.leaf-h a{margin-inline-start:auto;font-size:12px;color:var(--teal);text-decoration:none;font-weight:500}
.file{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:8px;text-decoration:none;font-size:14px}
.file:hover{background:var(--teal-soft)}
.file .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .dt{font-size:12px;color:var(--muted);white-space:nowrap}
.chip{flex:none;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;min-width:42px;text-align:center}
.c-pdf{background:#fde7e5;color:#b3261e}.c-doc{background:#e3edfd;color:#1f5bc6}.c-sheet{background:#e2f3e8;color:#1e7a43}.c-slide{background:#fff0d6;color:#a35d00}.c-img{background:#f1e6fb;color:#7a3db8}.c-vid{background:#e6e6e6;color:#333}.c-oth{background:#eef0f1;color:#55636a}
.leaf .file{align-items:flex-start}.leaf .file .nm{white-space:normal;line-height:1.45}.leaf .file .dt{display:none}
.new{font-size:11px;background:var(--gold);color:#fff;border-radius:6px;padding:0 6px}
.wait-txt{color:var(--wait);font-size:13.5px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.links a{text-decoration:none;background:var(--gold-soft);color:#7a5514;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:700}
.note{background:var(--teal-soft);border-radius:10px;padding:10px 14px;color:var(--teal);font-size:14px;margin-top:12px}
.embed{width:100%;height:560px;border:1px solid var(--line);border-radius:12px;background:#fff}
.results .file{border-bottom:1px solid #f0ede6;border-radius:0}
.path{font-size:12px;color:var(--muted)}
.pv{position:fixed;inset:0;background:rgba(10,30,36,.62);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.pv.on{display:flex}
.pv-box{background:#fff;border-radius:16px;width:min(980px,100%);height:min(92vh,900px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.pv-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.pv-head b{flex:1;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-head small{color:var(--muted)}
.pv-close{background:#f1efe9;border:0;border-radius:10px;width:36px;height:36px;font-size:20px;cursor:pointer;color:var(--ink)}
.pv iframe{flex:1;border:0;width:100%;background:#f3f3f3}
.pv-demo{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px;background:repeating-linear-gradient(0deg,#fafafa 0 28px,#f3f3f3 28px 29px)}
.footer-names{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;margin-bottom:6px}
footer{text-align:center;color:var(--muted);font-size:13.5px;padding:10px 16px 34px}
footer button{background:none;border:1px solid var(--line);border-radius:8px;padding:3px 10px;cursor:pointer;color:var(--teal);font-size:13px;margin-inline-start:6px}
@media (max-width:720px){.hero h1{font-size:34px}.stats{grid-template-columns:repeat(2,1fr)}.main-grid{grid-template-columns:1fr}.main-btn{padding:18px}.panel{padding:16px}}
@media print{.hero{padding:16px}.search,.back,.drive,footer button{display:none}.wrap{margin-top:10px}}

.hero{background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22900%22%20height%3D%221300%22%20viewBox%3D%220%200%20900%201300%22%3E%3Cpath%20d%3D%22M-80%20140%20L330%20-60%20L420%2040%20L60%20330%20Z%22%20fill%3D%22%23ffffff%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%2246%22%20stroke-linejoin%3D%22round%22%20opacity%3D%220.075%22/%3E%3Cpath%20d%3D%22M120%20420%20L520%20380%20L560%20470%20L470%20560%20L90%20600%20Z%22%20fill%3D%22%23ffffff%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%2246%22%20stroke-linejoin%3D%22round%22%20opacity%3D%220.060%22/%3E%3Cpath%20d%3D%22M-40%20700%20L250%20640%20L300%20760%20L200%20900%20L-60%20860%20Z%22%20fill%3D%22%23ffffff%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%2246%22%20stroke-linejoin%3D%22round%22%20opacity%3D%220.068%22/%3E%3Cpath%20d%3D%22M380%20760%20L700%20700%20L760%20800%20L420%20900%20Z%22%20fill%3D%22%23ffffff%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%2246%22%20stroke-linejoin%3D%22round%22%20opacity%3D%220.045%22/%3E%3Cpath%20d%3D%22M40%201040%20L360%20960%20L520%201110%20L460%201200%20L120%201230%20Z%22%20fill%3D%22%23ffffff%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%2246%22%20stroke-linejoin%3D%22round%22%20opacity%3D%220.060%22/%3E%3Cpath%20d%3D%22M620%20120%20L860%2060%20L900%20170%20L700%20260%20Z%22%20fill%3D%22%23ffffff%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%2246%22%20stroke-linejoin%3D%22round%22%20opacity%3D%220.037%22/%3E%3Cpath%20d%3D%22M640%201010%20L880%20980%20L900%201120%20L720%201180%20Z%22%20fill%3D%22%23ffffff%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%2246%22%20stroke-linejoin%3D%22round%22%20opacity%3D%220.037%22/%3E%3C/svg%3E") left -80px top -120px/820px 1180px no-repeat,radial-gradient(1200px 400px at 80% -20%,#1d8b97 0,transparent 60%),linear-gradient(135deg,#0b3f48,#14707c)}
footer{position:relative}

.hero{padding-top:24px}
.hero-logo{height:86px;display:block;margin:0 auto 14px;background:#fff;padding:11px 22px;border-radius:16px;box-shadow:0 6px 18px rgba(4,30,36,.25)}
.main-btn{flex-direction:column;align-items:stretch;gap:0;padding:0;overflow:hidden}
.mb-head{display:flex;align-items:center;gap:14px;padding:18px 22px;background:linear-gradient(135deg,#bfe0e3 0%,#e4f2f3 60%,#f6fbfb 100%);border-bottom:1px solid #cfe3e5}
.main-btn.gold .mb-head{background:linear-gradient(135deg,#f0d9a8 0%,#f8ecd2 60%,#fdf9ef 100%);border-bottom-color:#ecdcb8}
.main-btn .mb-head h2{margin:0;font-size:28px;font-weight:800;color:#0b3f48}
.main-btn.gold .mb-head h2{color:#6b4a0c}
.mb-head .ico{background:#fff;box-shadow:0 2px 8px rgba(11,63,72,.12)}
.gold .mb-head .ico{background:#fff}
.mb-body{display:block;padding:16px 22px 20px}
@media (max-width:720px){.main-btn{padding:0}.main-btn .mb-head h2{font-size:25px}}

/* بدون أصفر: كل شيء بدرجات الأخضر */
:root{--gold:#1f8a94;--gold-soft:#e3f0f1;--wait:#4a6c72;--wait-soft:#e6eff0}
.main-btn.gold{border-top-color:#1f8a94}
.main-btn.gold .mb-head{background:linear-gradient(135deg,#c9e6e2 0%,#e6f4f1 60%,#f6fbfa 100%);border-bottom-color:#cfe3e5}
.main-btn.gold .mb-head h2{color:#0b3f48}
.gold .ico{color:#1f8a94}
.hero .year{color:#fff}
.banner{background:#e3f0f1;border-color:#c5dfe1;color:#0b3f48}
.links a{color:#0b3f48}
.leaf.empty{background:#f7faf9}

/* ===== نمط بنفسجي فاتح مستوحى من لوحات التعلم ===== */
:root{--ink:#1e1b2e;--teal:#7b5cf0;--teal2:#9b84f5;--teal-soft:#ece7fd;--gold:#7b5cf0;--gold-soft:#ece7fd;--bg:#f4f1fc;--card:rgba(255,255,255,.72);--line:#e6e0f7;--muted:#6b6880;--ok:#6a4fe0;--ok-soft:#ebe5fd;--wait:#8a84a3;--wait-soft:#f1eef9}
body{background:radial-gradient(900px 600px at 85% 0%,#e4dcfb 0,transparent 60%),radial-gradient(800px 600px at 0% 100%,#ebe5fb 0,transparent 60%),#f4f1fc!important;color:var(--ink)}
.hero{background:transparent!important;color:var(--ink);text-align:right;padding:22px max(18px,calc((100% - 1060px)/2 + 16px)) 26px;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"logo title" "logo school" "names names";column-gap:22px;align-items:center}
.hero-logo{grid-area:logo;height:78px;margin:0;background:#fff;padding:10px 18px;border-radius:20px;box-shadow:0 6px 22px rgba(123,92,240,.12)}
.hero .ministry{display:none}
.hero h1{grid-area:title;color:var(--ink);font-size:46px;font-weight:800;margin:0;text-shadow:none;letter-spacing:-.5px}
.hero .school{grid-area:school;color:var(--muted);opacity:1;font-size:17px;margin:2px 0 0}
.hero .year{position:absolute;opacity:0;pointer-events:none}
.hero-names{grid-area:names;display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.hero-names span{background:rgba(255,255,255,.75);border:1px solid #fff;border-radius:999px;padding:8px 16px;font-size:14.5px;color:var(--muted);box-shadow:0 2px 10px rgba(123,92,240,.06)}
.hero-names b{color:var(--ink)}
.hero-names .yr{background:var(--teal);color:#fff;border-color:var(--teal)}
.wrap{margin-top:0}
.banner{background:#fff;border-color:var(--line);color:var(--muted);border-radius:16px}
.stats{gap:12px}
.stat{background:transparent;box-shadow:none;text-align:right;padding:6px 8px}
.stat b{font-size:46px;font-weight:600;color:var(--ink);letter-spacing:-1px}
.stat span{font-size:14px;color:var(--muted)}
.main-btn,.x-btn,.panel,.t-card,details.fold,.leaf,.search{background:var(--card)!important;border:1px solid rgba(255,255,255,.9)!important;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(123,92,240,.08)!important}
.main-btn{border-radius:26px;position:relative;border-top:1px solid #fff!important}
.mb-head,.main-btn.gold .mb-head{background:transparent!important;border-bottom:0!important;padding:22px 24px 6px}
.main-btn .mb-head h2,.main-btn.gold .mb-head h2{color:var(--ink);font-size:27px}
.mb-head .ico,.gold .mb-head .ico,.ico,.gold .ico{background:#fff!important;color:var(--teal)!important;border-radius:50%;box-shadow:0 2px 10px rgba(123,92,240,.12)}
.main-btn:after{content:"↗";position:absolute;top:22px;left:22px;width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px;color:var(--ink);box-shadow:0 2px 10px rgba(123,92,240,.12)}
.mb-body{padding:6px 24px 22px}
.main-btn p,.x-btn small{color:var(--muted)}
.pill{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:4px 14px;font-size:13.5px}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.wait{background:var(--wait-soft);color:var(--wait);border-color:transparent}
.bar{height:22px;border-radius:8px;background:repeating-linear-gradient(90deg,#ddd5fb 0 4px,transparent 4px 7px)!important}
.bar i{border-radius:8px 0 0 8px;background:repeating-linear-gradient(90deg,#7b5cf0 0 4px,transparent 4px 7px)!important}
h3.sec{color:var(--ink);font-size:22px}
h3.sec:after{background:var(--line)}
.x-btn{border-radius:22px}
.x-btn b{color:var(--ink)}
.search{border-radius:999px}
.panel{border-radius:26px}
.panel h2{color:var(--ink)}
.back{background:var(--teal);color:#fff;border-radius:999px;padding:8px 18px}
.drive{border-radius:999px;border-color:var(--line);color:var(--ink);background:#fff}
.tabs{border-bottom:0;background:rgba(255,255,255,.7);border-radius:999px;padding:5px;display:inline-flex;gap:4px}
.tab{border-radius:999px;border-bottom:0!important;margin:0;padding:8px 18px}
.tab.on{background:var(--teal);color:#fff!important}
.t-card{border-radius:22px}.t-card b{color:var(--ink)}
.dot{border-radius:999px;padding:2px 10px}
.dot.y{background:var(--teal);color:#fff}.dot.n{background:#fff;color:#a9a4bd;border:1px solid var(--line)}
details.fold{border-radius:20px}
details.fold>summary{background:transparent!important;color:var(--ink)}
details.fold>summary:before{color:var(--teal)}
.leaf{border-radius:16px}.leaf.empty{border-style:dashed!important}
.leaf-h{color:var(--ink)}
.matrix th,.matrix th:first-child{background:#f6f3fe;color:var(--ink)}
.yes{color:var(--teal)}
.new{background:var(--teal)}
.file:hover{background:#f1edfd}
.note{background:#fff;color:var(--muted);border:1px solid var(--line)}
.links a{background:#fff!important;color:var(--teal)!important;border:1px solid var(--line);border-radius:999px}
footer{background:transparent!important;color:var(--muted)}
footer button{border-color:var(--line);color:var(--teal);border-radius:999px;background:#fff}
@media (max-width:720px){.hero{grid-template-columns:1fr;grid-template-areas:"logo" "title" "school" "names";text-align:center;row-gap:8px}.hero-logo{margin:0 auto 6px}.hero h1{font-size:36px}.hero-names{justify-content:center}.extras{grid-template-columns:1fr 1fr;gap:10px}.x-btn{padding:14px 12px}.x-btn b{font-size:16px}.x-btn small{font-size:12.5px}.stat{text-align:center}.stat b{font-size:36px}.main-btn:after{top:18px;left:16px;width:40px;height:40px}.main-btn .mb-head h2{font-size:23px}}
</style>
</head>

function index(node,parent){BYID[node.id]=node;if(parent)PARENT[node.id]=parent;node.folders.forEach(f=>index(f,node));}
function countFiles(n){return n.files.length+n.folders.reduce((a,f)=>a+countFiles(f),0)}
function lastDate(n){let d=n.files.reduce((m,f)=>f.date>m?f.date:m,'');n.folders.forEach(f=>{const x=lastDate(f);if(x>d)d=x});return d}
function allFiles(n,path=[]){let r=n.files.map(f=>({...f,path}));n.folders.forEach(f=>r=r.concat(allFiles(f,path.concat(clean(f.name)))));return r}
function leaves(n){return n.folders.length?n.folders.flatMap(leaves):[{name:clean(n.name),n:n.files.length}]}
function findSec(s){
  if(!ROOT)return null;
  if(s.fid&&BYID[s.fid])return BYID[s.fid];
  const q=norm(s.match||s.title),queue=[...ROOT.folders];
  while(queue.length){const f=queue.shift();if(norm(f.name).includes(q))return f;queue.push(...f.folders)}
  return null;
}
function teacherStats(sec){
  const teachers=sec.folders;const cols=[];
  teachers.forEach(t=>t.folders.flatMap(leaves).forEach(l=>{if(!cols.includes(l.name))cols.push(l.name)}));
  const rows=teachers.map(t=>{const L={};t.folders.flatMap(leaves).forEach(l=>L[l.name]=(L[l.name]||0)+l.n);
    const done=cols.filter(c=>L[c]>0).length;return{t,L,done,pct:cols.length?Math.round(done/cols.length*100):(countFiles(t)?100:0)}});
  const pct=rows.length?Math.round(rows.reduce((a,r)=>a+r.pct,0)/rows.length):0;
  return{cols,rows,pct};
}

/* ---------- عناصر مساعدة ---------- */
function chip(t,name){t=t||'';const e=(name.split('.').pop()||'').toLowerCase();
  if(t.includes('pdf')||e==='pdf')return'<span class="chip c-pdf">PDF</span>';
  if(t.includes('spreadsheet')||t.includes('excel')||/xlsx?|csv/.test(e))return'<span class="chip c-sheet">جدول</span>';
  if(t.includes('presentation')||t.includes('powerpoint')||/pptx?/.test(e))return'<span class="chip c-slide">عرض</span>';
  if(t.includes('document')||t.includes('word')||/docx?/.test(e))return'<span class="chip c-doc">مستند</span>';
  if(t.startsWith('image')||/png|jpe?g|heic|webp/.test(e))return'<span class="chip c-img">صورة</span>';
  if(t.startsWith('video')||/mp4|mov/.test(e))return'<span class="chip c-vid">فيديو</span>';
  if(t.includes('folder'))return'<span class="chip c-oth">مجلد</span>';
  return'<span class="chip c-oth">ملف</span>';}
let HF;try{HF=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long'})}catch(e){HF=null}
const fmt=d=>{if(!d)return'';try{return HF?HF.format(new Date(d)):new Date(d).toLocaleDateString('ar')}catch(e){return''}};
const isNew=d=>d&&(Date.now()-new Date(d))<7*864e5;
const fileRow=(f,showPath)=>`<a class="file" title="${esc(fmt(f.date))}" href="${esc(f.url)}" target="_blank" rel="noopener" data-name="${esc(f.name)}" data-date="${esc(fmt(f.date))}" onclick="pv(event,this)">${chip(f.type,f.name)}<span class="nm">${esc(f.name.replace(/\.[a-z0-9]{2,5}$/i,''))}${showPath&&f.path.length?`<div class="path">${esc(f.path.join(' ‹ '))}</div>`:''}</span>${isNew(f.date)?'<span class="new">جديد</span>':''}<span class="dt">${fmt(f.date)}</span></a>`;
const driveLink=(url,txt='فتح في Google Drive ↗')=>url&&url!=='#'?`<a class="drive" href="${esc(url)}" target="_blank" rel="noopener">${txt}</a>`:'';
const emptyLabel=(sec,name)=>{const m=sec&&sec.emptyLabels;if(m)for(const k in m)if(norm(name)===norm(k))return m[k];return'قيد الاستكمال'};

function pctNode(n,sec){const L=leaves(n).filter(l=>emptyLabel(sec,l.name)==='قيد الاستكمال');
  if(!L.length)return countFiles(n)?100:0;return Math.round(L.filter(l=>l.n>0).length/L.length*100)}
const prog=p=>`<div class="prog"><div class="bar"><i style="width:${p}%"></i></div><span>${p}%</span></div>`;
function renderBody(node,depth,sec){
  let h='';
  if(node.files.length)h+=`<div>${node.files.map(f=>fileRow(f)).join('')}</div>`;
  const subs=node.folders;
  if(!subs.length){if(!node.files.length)h+=`<div class="wait-txt">⏳ ${emptyLabel(sec,node.name)}</div>`;return h}
  if(subs.every(f=>!f.folders.length)){
    h+='<div class="leaf-grid">'+subs.map(f=>`<div class="leaf ${f.files.length?'':'empty'}"><div class="leaf-h">${f.files.length?'✅':'⏳'} ${esc(clean(f.name))}${f.url!=='#'?`<a href="${esc(f.url)}" target="_blank" rel="noopener">درايف ↗</a>`:''}</div>${f.files.length?f.files.map(x=>fileRow(x)).join(''):`<div class="wait-txt">${emptyLabel(sec,f.name)}</div>`}</div>`).join('')+'</div>';
    return h;
  }
  h+=subs.map(f=>{const c=countFiles(f);return`<details class="fold" ${depth<1?'open':''}><summary>${esc(clean(f.name))}<span class="pill ${c?'ok':'wait'}">${c?c+' ملف':emptyLabel(sec,f.name)}</span></summary><div class="fold-body">${renderBody(f,depth+1,sec)}</div></details>`}).join('');
  return h;
}

/* ---------- الصفحات ---------- */
function home(){
  let h='';
  if(MODE==='demo')h+='<div class="banner">عرض تجريبي ببيانات نموذجية — بعد وضع رابط Apps Script تظهر ملفات الدرايف الفعلية وتتحدث تلقائياً.</div>';
  if(ERR)h+=`<div class="banner err">${esc(ERR)}</div>`;
  const vis=SECS.map(s=>({s,node:findSec(s)})).filter(x=>MODE==='embed'?x.s.fid:x.node);
  if(ROOT){
    const ach=vis.find(x=>x.s.view==='teachers');const st=ach?teacherStats(ach.node):null;
    const total=countFiles(ROOT),last=lastDate(ROOT);
    h+=`<div class="stats">
      <div class="stat"><b>${st?st.rows.length:'—'}</b><span>مادة / معلمة</span></div>
      <div class="stat"><b>${total}</b><span>شاهد وملف</span></div>
      <div class="stat"><b>${st?st.pct+'%':'—'}</b><span>نسبة اكتمال التحصيل</span></div>
      <div class="stat"><b style="font-size:19px;padding:4px 0">${last?fmt(last):'—'}</b><span>آخر إضافة</span></div></div>`;
  }
  const mains=vis.filter(x=>x.s.main),extras=vis.filter(x=>!x.s.main);
  h+='<div class="main-grid">'+mains.map(({s,node})=>{
    let meta='';
    if(node){const c=countFiles(node);
      if(s.view==='teachers'){const st=teacherStats(node);meta=`<div class="meta"><span class="pill">${st.rows.length} مواد</span><span class="pill ${st.pct===100?'ok':'wait'}">اكتمال ${st.pct}%</span><span class="pill">${c} ملف</span></div><div class="bar"><i style="width:${st.pct}%"></i></div>`}
      else meta=`<div class="meta"><span class="pill">${c} ملف</span>${s.note?'<span class="pill wait">التحصيلي: العام القادم</span>':''}</div>`;}
    return`<div role="button" tabindex="0" class="main-btn ${s.gold?'gold':''}" onclick="go('${s.key}')"><span class="mb-head"><span class="ico">${ico(s.icon)}</span><h2>${esc(s.title)}</h2></span><span class="mb-body"><p>${esc(s.desc)}</p>${meta}</span></div>`}).join('')+'</div>';
  if(extras.length){h+='<h3 class="sec">أقسام مساندة</h3><div class="extras">'+extras.map(({s,node})=>{const c=node?countFiles(node):null;
    return`<div role="button" tabindex="0" class="x-btn${c===0?' empty':''}" onclick="go('${s.key}')"><b>${esc(s.title)}</b><small>${esc(s.desc)}</small>${c!==null?`<div class="meta"><span class="pill ${c?'':'wait'}">${c?c+' ملف':'قيد الاستكمال'}</span></div>`:''}</div>`}).join('')+'</div>';}
  if(ROOT)h+='<input class="search" id="q" placeholder="🔍  ابحثي عن ملف أو شاهد باسمه في كامل الملف…" oninput="search(this.value)"><div class="panel results" id="res" style="display:none;margin-top:10px"></div>';
  app.innerHTML=h;
}
function search(q){const box=document.getElementById('res');q=norm(q||'');if(q.length<2){box.style.display='none';return}
  const r=allFiles(ROOT).filter(f=>norm(f.name).includes(q)||norm(f.path.join(' ')).includes(q)).slice(0,60);
  box.style.display='block';box.innerHTML=r.length?r.map(f=>fileRow(f,true)).join(''):'<div class="wait-txt">لا توجد نتائج</div>';}

function sectionView(s,tIdx){
  const node=findSec(s);
  let h=`<div class="panel"><div class="topbar"><button class="back" onclick="go('${tIdx!=null?s.key:''}')">→ ${tIdx!=null?esc(s.title):'الرئيسية'}</button>`;
  if(MODE==='embed'){
    h+=`${driveLink('https://drive.google.com/drive/folders/'+s.fid)}</div><h2>${esc(s.title)}</h2><p class="desc">${esc(s.desc)}</p>
      <iframe class="embed" src="https://drive.google.com/embeddedfolderview?id=${s.fid}#list" loading="lazy"></iframe>${extrasOf(s)}</div>`;
    app.innerHTML=h;return;
  }
  if(!node){app.innerHTML=h+'</div><p>لم يُعثر على المجلد.</p></div>';return}
  if(tIdx!=null){
    const t=node.folders[tIdx];if(!t){go(s.key);return}
    const st=teacherStats(node).rows[tIdx];
    h+=`${driveLink(t.url)}</div><h2>${esc(clean(t.name))}</h2>
      <p class="desc">اكتمال الشواهد: ${st.pct}% · ${countFiles(t)} ملف</p><div class="bar" style="margin-bottom:14px"><i style="width:${st.pct}%"></i></div>${renderBody(t,0,s)}</div>`;
    app.innerHTML=h;return;
  }
  h+=`${driveLink(node.url)}</div><h2>${esc(s.title)}</h2><p class="desc">${esc(s.desc)}</p>`;
  if(s.view==='teachers'&&node.folders.length){
    const st=teacherStats(node);
    h+=`<div class="tabs"><button class="tab on" data-t="cards" onclick="tab(this)">المواد (${st.rows.length})</button>${st.cols.length?'<button class="tab" data-t="matrix" onclick="tab(this)">لوحة الاكتمال</button>':''}</div>`;
    h+=`<div id="tab-cards" class="t-grid">${st.rows.map((r,i)=>`<div role="button" tabindex="0" class="t-card" onclick="go('${s.key}-t${i}')"><b>${esc(clean(r.t.name))}</b><div class="row"><span>${countFiles(r.t)} ملف</span><span>${r.pct}%</span></div><div class="bar"><i style="width:${r.pct}%"></i></div><div class="dots">${st.cols.map(c=>`<span class="dot ${r.L[c]?'y':'n'}">${esc(c)}</span>`).join('')}</div></div>`).join('')}</div>`;
    if(st.cols.length)h+=`<div id="tab-matrix" style="display:none"><div class="matrix"><table><tr><th>المادة</th>${st.cols.map(c=>`<th>${esc(c)}</th>`).join('')}<th>الاكتمال</th></tr>${st.rows.map((r,i)=>`<tr><td><a href="#${s.key}-t${i}">${esc(clean(r.t.name))}</a></td>${st.cols.map(c=>`<td>${r.L[c]?`<span class="yes">✓ ${r.L[c]}</span>`:'<span class="no">—</span>'}</td>`).join('')}<td><b>${r.pct}%</b></td></tr>`).join('')}</table></div><div class="legend">✓ = تم رفع الشاهد (والرقم عدد الملفات) · — = لم يُرفع بعد. تتحدث تلقائياً كلما أضافت معلمة ملفاً.</div></div>`;
  } else h+=renderBody(node,0,s);
  h+=extrasOf(s)+'</div>';
  app.innerHTML=h;
}
function extrasOf(s){let h='';if(s.note)h+=`<div class="note">${esc(s.note)}</div>`;
  if(s.links&&s.links.length)h+='<div class="links">'+s.links.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title)} ↗</a>`).join('')+'</div>';return h}
function tab(b){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('tab-cards').style.display=b.dataset.t==='cards'?'':'none';
  const m=document.getElementById('tab-matrix');if(m)m.style.display=b.dataset.t==='matrix'?'':'none';}


function copyUrl(u){if(!u)return'';const m=u.match(/docs\.google\.com\/(document|spreadsheets|presentation)\/d\/([\w-]+)/);
  return m?`https://docs.google.com/${m[1]}/d/${m[2]}/copy`:u;}
/* ---------- معاينة الملف داخل اللوحة ---------- */
function previewUrl(u){const m=u.match(/\/d\/([\w-]+)/)||u.match(/[?&]id=([\w-]+)/);if(!m)return'';
  if(/docs\.google\.com\/(document|spreadsheets|presentation)/.test(u))return u.replace(/\/(edit|view|htmlview)[^]*$/,'')+'/preview';
  return'https://drive.google.com/file/d/'+m[1]+'/preview';}
function pv(e,a){const u=a.getAttribute('href');const p=u&&u!=='#'?previewUrl(u):'';
  if(u&&u!=='#'&&!p)return; e.preventDefault();
  document.getElementById('pv-name').textContent=a.dataset.name;document.getElementById('pv-date').textContent=a.dataset.date||'';
  document.getElementById('pv-chip').innerHTML=a.querySelector('.chip').outerHTML;
  const o=document.getElementById('pv-open');o.href=u;o.style.display=p?'':'none';
  document.getElementById('pv-body').innerHTML=p?`<iframe src="${p}" allow="autoplay" allowfullscreen></iframe>`:'<div class="pv-demo"><div><div style="font-size:42px">📄</div>هنا يظهر الملف نفسه كما يعرضه Google Drive<br>(PDF، صور، مستندات، جداول، عروض، فيديو)<br><small>هذا عرض تجريبي — مع الملفات الحقيقية يظهر محتواها كاملاً</small></div></div>';
  document.getElementById('pv').classList.add('on');document.body.style.overflow='hidden';}
function pvClose(){document.getElementById('pv').classList.remove('on');document.getElementById('pv-body').innerHTML='';document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')pvClose();if(e.key==='Enter'&&e.target.getAttribute&&e.target.getAttribute('role')==='button')e.target.click()});

/* ---------- التنقل ---------- */
function go(h){if(location.hash.slice(1)===h)route();else location.hash=h;window.scrollTo({top:0,behavior:'smooth'})}
function route(){const h=decodeURIComponent(location.hash.slice(1));
  const m=h.match(/^([a-z0-9]+)(?:-t(\d+))?$/);const s=m&&SECS.find(x=>x.key===m[1]);
  if(s)sectionView(s,m[2]!=null?+m[2]:null);else home();}
window.addEventListener('hashchange',route);

/* ---------- التحميل ---------- */
async function load(fresh){
  if(CONFIG.scriptUrl){
    app.innerHTML='<div class="panel" style="text-align:center;color:#66767c">جارٍ تحميل أحدث الملفات من الدرايف…</div>';
    try{const r=await fetch(CONFIG.scriptUrl+(fresh?'?fresh=1':''));const j=await r.json();ROOT=j.tree;UPDATED=j.updated;MODE='live';ERR=''}
    catch(e){ERR='تعذّر الاتصال بالدرايف الآن — تُعرض روابط المجلدات مباشرة.';MODE=SECS.some(s=>s.fid)?'embed':'demo';if(MODE==='demo')ROOT=demo()}
  } else if(SECS.some(s=>s.fid))MODE='embed';
  else{MODE='demo';ROOT=demo()}
  for(const k in BYID)delete BYID[k];if(ROOT)index(ROOT);
  foot();route();
}
function foot(){document.getElementById('foot').innerHTML=`<div class="footer-names"><span>مسؤولة ملف نواتج التعلم: <b>${esc(CONFIG.preparedBy)}</b></span><span>مديرة المدرسة: <b>${esc(CONFIG.principal)}</b></span></div>${UPDATED?` · آخر مزامنة: ${new Date(UPDATED).toLocaleTimeString('ar-SA',{hour:'numeric',minute:'2-digit'})}<button onclick="load(true)">تحديث الآن</button>`:''}`}

/* ---------- بيانات العرض التجريبي ---------- */
function demo(){
  let id=0;const D=n=>new Date(Date.now()-n*864e5).toISOString();
  const F=(name,a=[],b=[])=>({id:'d'+(++id),name,url:'#',folders:a.filter(x=>x.folders),files:a.filter(x=>!x.folders).concat(b)});
  const f=(name,days,type)=>({name,url:'#',type:type||'application/pdf',date:D(days)});
  const teacher=(name,s)=>F(name,[
    F('١- تحليلات الاختبارات',[
      F('١- تشخيصي',s[0]?[f('تحليل الاختبار التشخيصي — رياضيات ٢',s[0]),f('خطة معالجة الفاقد التعليمي',s[0]+1,'application/vnd.google-apps.document')]:[]),
      F('٢- فترة أولى',s[1]?[f('تحليل نتائج اختبار الفترة الأولى',s[1],'application/vnd.google-apps.spreadsheet')]:[]),
      F('٣- فترة ثانية',s[2]?[f('تحليل نتائج اختبار الفترة الثانية',s[2])]:[]),
      F('٤- نهائي',[])]),
    F('٢- الخطط العلاجية والإثرائية',s[3]?[f('الخطة العلاجية للطالبات المتأخرات',s[3],'application/vnd.google-apps.document'),f('الخطة الإثرائية للمتفوقات',s[3]+2,'application/vnd.google-apps.document'),f('شاهد تنفيذ — حصة علاجية',s[3]+1,'image/jpeg')]:[])
  ]);
  return F('ملف نواتج التعلم',[
    F('ملف التحصيل الدراسي',[teacher('ناهد علي عطار',[20,3,0,5]),teacher('معلمة نموذجية ٢',[25,9,0,0]),teacher('معلمة نموذجية ٣',[22,0,0,12]),teacher('معلمة نموذجية ٤',[0,0,0,0])]),
    F('ملف القدرات والتحصيلي',[
      F('القدرات',[F('١- الخطة الإجرائية للقدرات',[f('الخطة الإجرائية للاستعداد لاختبار القدرات',30,'application/vnd.google-apps.document')]),
        F('٢- حصر الطالبات المسجلات',[f('كشف المسجلات في قياس',14,'application/vnd.google-apps.spreadsheet')]),
        F('٣- الحصص والدورات التدريبية',[f('جدول حصص القدرات',18),f('صور من حصة التدريب',2,'image/jpeg')]),
        F('٤- الاختبارات التدريبية وتحليلها',[f('تقرير تحليل اختبار القدرات الكمي ١',1)]),
        F('٥- نتائج قياس الرسمية',[])]),
      F('التحصيلي',[])]),
    F('التعريف بالملف ولجنة التحصيل',[F('قرار تشكيل اللجنة ومهامها',[f('قرار التشكيل',40)]),F('الخطة الإجرائية والجدول الزمني',[f('الخطة الإجرائية',38)]),F('محاضر الاجتماعات',[f('محضر الاجتماع الأول',10)])]),
    F('نتائج العام السابق',[],[f('تحليل نتائج ١٤٤٧هـ ونقاط القوة والضعف',45)]),
    F('فئات المتابعة',[F('المتفوقات والموهوبات',[f('بيان المتفوقات والحوافز',8,'application/vnd.google-apps.spreadsheet')]),F('المتأخرات دراسياً',[])]),
    F('التواصل مع أولياء الأمور',[]),
    F('البرامج ومجتمعات التعلم',[],[f('مجتمع تعلم: تحليل نتائج الاختبارات',6,'application/vnd.google-apps.presentation')]),
    F('شهادات الشكر',[])
  ]);
}

document.getElementById('title').textContent=CONFIG.title;
document.getElementById('school').textContent=CONFIG.school;
document.getElementById('year').textContent=CONFIG.year;
load();
</script>
